baseURL = "https://myblog-snowy-three.vercel.app/"
languageCode = "zh-cn"
title = "鱼肉的Blog"
theme = "PaperMod"
hasCJKLanguage = true

[outputs]
    home = ["HTML", "RSS", "JSON"]

[params]
    mainSections = ["posts", "thinking"]
    defaultTheme = "light"
    ShowReadingTime = false
    ShowShareButtons = true
    ShowWordCount = true
    DateFormat = "2006年1月2日"
    author = "鱼肉"

    # 首页个人资料卡片
    [params.profileInfo]
        name = "鱼肉"
        headline = "Hi, 我是鱼肉"
        subtitle = "全栈工程 · 大模型实战 · 数字创造者"
        bio = "目前是西交利物浦大学的本科生，曾在猎豹移动担任产品经理实习生。在这里记录我的编程思考、技术实战以及正在构建的各类项目。热爱开源与前沿技术，平时喜欢折腾大语言模型实战应用、全栈工程与有趣的数字工具。"
        avatarUrl = "/images/avatar-448.webp"

    # 社交媒体图标（name 必须与 PaperMod 内置图标名匹配）
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/Kie70"
        title = "GitHub"
    [[params.socialIcons]]
        name = "wechat"
        url = "#"
        title = "微信号: ugniop"
    [[params.socialIcons]]
        name = "email"
        url = "mailto:boyu.zhu25@outlook.com"
        title = "邮箱"
    [[params.socialIcons]]
        name = "tiktok"
        url = "https://v.douyin.com/b2ahSeLSz_w/"
        title = "抖音"

    [params.fuseOpts]
        threshold = 0.3
        ignoreLocation = true
        distance = 100
        limit = 10
        keys = ["title", "summary", "content"]
        minMatchCharLength = 2
        findAllMatches = false

[menu]
    [[menu.main]]
        identifier = "archives"
        name = "文章"
        url = "/archives/"
        weight = 5
    [[menu.main]]
        identifier = "projects"
        name = "项目"
        url = "/projects/"
        weight = 6
    [[menu.main]]
        identifier = "skills"
        name = "Skills"
        url = "/skills/"
        weight = 7
    [[menu.main]]
        identifier = "about"
        name = "关于"
        url = "/about/"
        weight = 8

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
