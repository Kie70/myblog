{{- define "main" }}
<section class="skills-page">
  <header class="page-header skills-header">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="skills-list">
    {{- range site.Data.skills }}
    {{- if .url }}
    <a class="skill-row" href="{{ .url | strings.TrimPrefix "/" | relURL }}">
    {{- else }}
    <article class="skill-row">
    {{- end }}
      <div class="skill-row-content">
        <h2 class="archive-entry-title">{{ .name }}</h2>
        <p class="archive-meta skill-description">{{ .description }}</p>
      </div>
      {{- with .date }}
      <time class="archive-meta skill-date" datetime="{{ . }}">{{ time.Format "2006年1月2日" . }}</time>
      {{- end }}
    {{- if .url }}</a>{{- else }}</article>{{- end }}
    {{- end }}
  </div>
</section>
{{- end }}
